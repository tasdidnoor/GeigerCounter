; ESP32 Geiger counter (SBM-20) - PlatformIO project
;
; The platform is pinned to 6.9.0 (Arduino-ESP32 core 2.0.17) for reproducible
; builds. The firmware also compiles against Arduino-ESP32 core 3.x
; (e.g. pioarduino) thanks to a small LEDC compatibility shim in main.cpp.

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    olikraus/U8g2@^2.35.30

build_flags =
    -DCORE_DEBUG_LEVEL=0